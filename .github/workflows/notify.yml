name: Daily Point Notification

on:
  schedule:
    # Roda a cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # Permite rodar manualmente para testar

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run notification check
        env:
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
          NOTIFICATION_TIMES: ${{ secrets.NOTIFICATION_TIMES }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          STORAGE_PATH: './storage.json'
        run: npm run check

      - name: Commit and push changes (storage.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f storage.json ]; then
            git add storage.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update storage state [skip ci]" && git push)
          else
            echo "No storage.json found, skipping commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
